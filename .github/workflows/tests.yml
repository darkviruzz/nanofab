# The check nothing in M6-M9 had, and the lesson it protects is one this
# repository already paid for (handoff R9).
#
# Every green suite from M5 to M9 was green on one container, run by hand — and
# for four milestones "9 skipped" appeared in every commit message and nobody
# read it as "the UI has no tests". Installing Qt in this container turned up an
# M7 regression the same afternoon.
#
# So the clause that matters here is not "run pytest". It is **fail on a skip**.
# A suite that reports skips as a number is a suite whose skips are invisible,
# and the `importorskip` guards stay — they are right for a contributor without
# Qt. What was missing was never the guard; it was the assertion that CI has no
# excuse to use one.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      # Qt needs a platform plugin and no runner has a display. Without this the
      # widget tests skip, which is the exact failure this workflow exists to
      # make impossible.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[dev,ui]"
      - name: compileall
        run: python -m compileall nanofab_v3 tests
      - name: pytest, and no test may skip
        run: |
          python -m pytest -p no:cacheprovider --strict-markers -q | tee result.txt
          if grep -Eq '[0-9]+ skipped' result.txt; then
            echo "::error::a skipped test is not a passing test — see handoff R9"
            grep -E '[0-9]+ skipped' result.txt
            exit 1
          fi
